services:
  - type: web
    name: demo
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /one
        destination: /one/index.html
      - type: rewrite
        source: /one/*
        destination: /one/index.html
      - type: rewrite
        source: /two
        destination: /two/index.html
      - type: rewrite
        source: /two/*
        destination: /two/index.html
      - type: rewrite
        source: /three
        destination: /three/index.html
      - type: rewrite
        source: /three/*
        destination: /three/index.html
      - type: redirect
        source: /sushione
        destination: /one
      - type: redirect
        source: /sushione/*
        destination: /one/*
      - type: redirect
        source: /sushiwto
        destination: /two
      - type: redirect
        source: /sushiwto/*
        destination: /two/*
      - type: redirect
        source: /sushitree
        destination: /three
      - type: redirect
        source: /sushitree/*
        destination: /three/*
